<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Champions 2D - Estilo Tibia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>⚡ Comic Champions (Tibia Style)</h1>

        <div id="creation-screen">
            <h2>Crie seu Herói de HQ</h2>

            <label>Nome do Herói:</label>
            <input type="text" id="hero-name-input" value="Sombra Urbana" maxlength="15">

            <label>Arquétipo / Classe:</label>
            <select id="hero-class-select" onchange="updatePreview()">
                <option value="vigilante">🕵️ Vigilante Tecnológico (Rápido)</option>
                <option value="mutante">🧬 Mutante Elemental (Poderoso)</option>
                <option value="alien">👽 Guardião Cósmico (Resistente)</option>
            </select>

            <label>Estilo de Traje / Formato:</label>
            <select id="hero-shape-select" onchange="updatePreview()">
                <option value="standard">Capuz & Máscara (Quadrado)</option>
                <option value="armored">Armadura Pesada (Losango)</option>
                <option value="speedster">Aerodinâmico (Círculo)</option>
            </select>

            <div class="color-group">
                <div>
                    <label>Cor Principal:</label>
                    <input type="color" id="primary-color" value="#00d2d3" onchange="updatePreview()">
                </div>
                <div>
                    <label>Cor do Emblema:</label>
                    <input type="color" id="accent-color" value="#ff9f43" onchange="updatePreview()">
                </div>
            </div>

            <label>Cenário da Missão:</label>
            <select id="map-select">
                <option value="city">🏙️ Metrópole em Ruínas</option>
                <option value="lab">🧪 Laboratório Secreto</option>
                <option value="space">🌌 Estação Espacial</option>
            </select>

            <div class="preview-box">
                <p>Visual do Herói:</p>
                <div id="preview-sprite">
                    <div id="preview-symbol"></div>
                </div>
            </div>

            <button class="btn-main" onclick="startGame()">Entrar na Arena 🚀</button>
        </div>

        <div id="game-screen" style="display: none;">
            <div id="hud">
                <span id="player-display-name">Herói</span> | 
                HP: <span id="hp-display">100</span> | 
                Kills: <span id="score-display">0</span>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div id="controls-hint">
                <p>🎮 <b>Controles:</b> Use as setas (<b>W, A, S, D</b> ou <b>Setas do teclado</b>) para andar. Clique na tela para disparar um ataque de energia!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
